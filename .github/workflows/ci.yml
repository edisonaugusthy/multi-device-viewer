name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check extension
        run: npm run compile

      - name: Validate localized extension metadata
        run: npm run validate:locales

      - name: Validate Chrome Web Store assets
        run: npm run validate:store-assets

      - name: Run unit tests
        run: npm test

      - name: Install browser test runtimes
        run: npx playwright install --with-deps chromium

      - name: Run Chrome browser tests
        run: npm run test:e2e

      - name: Build extension
        run: npm run build

      - name: Package extension zip
        run: npm run zip

      - name: Validate Chrome package
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          npm run validate:chrome-zip -- ".output/multi-device-viewer-${version}-chrome.zip"
