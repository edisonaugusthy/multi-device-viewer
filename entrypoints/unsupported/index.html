<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open a website first</title>
    <style>
      :root {
        color-scheme: light dark;
        --surface: #ffffff;
        --surface-2: #f7f8fa;
        --field: #ffffff;
        --line: #d5d9de;
        --line-soft: #e3e6ea;
        --ink: #14171a;
        --muted: #575e66;
        --faint: #8a9099;
        --accent: #0f766e;
        --accent-soft: #e6f4f1;
        --accent-line: #9ed8cf;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #14171d;
          --surface-2: #1b1f27;
          --field: rgb(255 255 255 / 0.06);
          --line: rgb(255 255 255 / 0.14);
          --line-soft: rgb(255 255 255 / 0.08);
          --ink: #e8eaed;
          --muted: #9aa1aa;
          --faint: #6f7680;
          --accent: #2dd4bf;
          --accent-soft: rgb(45 212 191 / 0.13);
          --accent-line: rgb(45 212 191 / 0.4);
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 300px;
        margin: 0;
        padding: 14px;
        background: var(--surface);
        color: var(--ink);
        font: 13px/1.45 Geist, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* A small browser window: the extension works on pages like this one. */
      .scene {
        overflow: hidden;
        border: 1px solid var(--line-soft);
        border-radius: 12px;
        background: var(--surface-2);
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 9px;
        border-bottom: 1px solid var(--line-soft);
      }
      .dots { display: flex; gap: 4px; }
      .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
      .address {
        display: flex;
        flex: 1;
        align-items: center;
        gap: 5px;
        min-width: 0;
        height: 22px;
        padding: 0 8px;
        border: 1px solid var(--line-soft);
        border-radius: 999px;
        background: var(--field);
        color: var(--muted);
        font: 500 11px/1 "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: nowrap;
      }
      .address svg { flex: none; color: var(--accent); }
      .action {
        position: relative;
        display: grid;
        flex: none;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 7px;
        background: var(--accent-soft);
        box-shadow: 0 0 0 1px var(--accent-line);
      }
      .action img { width: 16px; height: 16px; }
      .action::after {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: 8px;
        box-shadow: 0 0 0 0 var(--accent-line);
        animation: pulse 2.2s ease-out infinite;
      }
      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 var(--accent-line); }
        70%, 100% { box-shadow: 0 0 0 7px transparent; }
      }
      @media (prefers-reduced-motion: reduce) { .action::after { animation: none; } }

      .devices {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 10px;
        height: 72px;
        padding-bottom: 12px;
      }
      .device {
        border: 1.5px solid var(--line);
        background: var(--surface);
        padding: 3px;
      }
      .device span { display: block; height: 100%; border-radius: 2px; background: var(--accent-soft); }
      .phone { width: 22px; height: 42px; border-radius: 6px; }
      .phone span { border-radius: 3px; }
      .tablet { width: 38px; height: 50px; border-radius: 6px; }
      .laptop { display: flex; flex-direction: column; align-items: center; }
      .laptop .device { width: 70px; height: 44px; border-radius: 5px 5px 0 0; }
      .laptop b { display: block; width: 86px; height: 5px; border-radius: 0 0 4px 4px; background: var(--line); }

      h1 { margin: 14px 2px 4px; font-size: 15px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; }
      p { margin: 0 2px; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="scene" aria-hidden="true">
      <div class="bar">
        <span class="dots"><i></i><i></i><i></i></span>
        <span class="address">
          <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="7" width="10" height="7" rx="1.5" /><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" /></svg>
          localhost:3000
        </span>
        <span class="action"><img src="/icons/icon-32.png" alt="" /></span>
      </div>
      <div class="devices">
        <div class="device phone"><span></span></div>
        <div class="device tablet"><span></span></div>
        <div class="laptop"><div class="device"><span></span></div><b></b></div>
      </div>
    </div>
    <h1 id="title">Open a website first</h1>
    <p id="hint">Switch to the page you’re developing, then click the extension again.</p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
