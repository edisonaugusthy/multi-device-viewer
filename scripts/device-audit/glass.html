<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>
html{scrollbar-width:none}html::-webkit-scrollbar{display:none}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui;color:white;background:#111318}header{position:sticky;top:0;z-index:2;padding:18px;background:#111318d9;height:60px;display:flex;justify-content:space-between}main{padding:70px 22px;min-height:1800px;text-align:center;background:linear-gradient(25deg,#141625c0,#0007),repeating-linear-gradient(135deg,#162e4a 0 85px,#503039 85px 170px,#24544b 170px 255px,#684923 255px 340px)}h1{font-size:36px;line-height:1.2}input{width:100%;padding:16px;background:#0008;border:1px solid #aaa8;color:white;border-radius:8px}button{padding:10px 18px;background:#ea2437;border:0;color:white;border-radius:8px;font-weight:700}footer{position:fixed;bottom:0;left:0;right:0;padding:12px;text-align:center;background:#172421d9}#left-edge{position:fixed;left:0;top:50%;width:5px;height:30px}#safe{position:absolute;bottom:0;height:env(safe-area-inset-bottom);width:1px}

html.light body{color:#17212c;background:#f5f8fa}html.light header,html.light footer{background:#f5f8fad9}html.light main{background:repeating-linear-gradient(135deg,#d7e9f7 0 85px,#f4dfe5 85px 170px,#d9efe4 170px 255px,#f9e6c6 255px 340px)}html.light input{background:#ffffff80;color:#17212c}
</style><header><strong>STREAM</strong><button>Sign in</button></header><main><h1>Your next favorite story.</h1><p>A dark, textured page for testing transparent browser controls.</p><input placeholder="Email address"><p><button>Get started</button></p></main><div id="left-edge"></div><footer id="fixed-footer"><button>Continue — fixed footer</button></footer><div id="safe"></div><script>
if(new URLSearchParams(location.search).has('light'))document.documentElement.classList.add('light');
addEventListener('message',event=>{
 if(event.source===parent&&['http://127.0.0.1:5190','http://localhost:5190'].includes(event.origin)&&event.data?.type==='device-audit-scroll'&&Number.isFinite(event.data.top))window.scrollTo(0,Math.max(0,event.data.top));
});
let lastTop=0,scrollPending=false;
addEventListener('scroll',()=>{
 if(scrollPending)return;
 scrollPending=true;
 requestAnimationFrame(()=>{
  scrollPending=false;
  parent.postMessage({type:'device-audit-scroll-state',top:scrollY,delta:scrollY-lastTop},'*');
  lastTop=scrollY;
 });
});
</script></html>
