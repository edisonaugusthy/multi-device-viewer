<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobile View store artwork</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#153b32;background:#f0f4ef}.brand{display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:-.4px;font-size:19px}.brand img{width:29px;height:29px}.screen{position:relative;width:1280px;height:800px;background:#f5f5f3}.screen header{height:80px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:15px 32px;background:#fff;border-bottom:1px solid #e3e9e5}.screen h1{margin:0;line-height:1.15;letter-spacing:-.65px;font-weight:750;font-size:28px;max-width:990px}.screen header .brand{font-size:14px;white-space:nowrap}.screen header .brand img{width:24px;height:24px}.screen>.capture{position:absolute;top:80px;left:0;width:1280px;height:720px}.promo{width:1400px;height:560px;position:relative;background:radial-gradient(ellipse at 90% 50%,#d5e8d6,transparent 65%),#f0f4ef}.promo>.brand{position:absolute;left:50px;top:38px}.promo h1{position:absolute;left:50px;top:112px;width:470px;margin:0;font-size:58px;line-height:1.05;letter-spacing:-2.8px}.promo p{position:absolute;left:52px;top:325px;font-size:19px;line-height:1.5;max-width:365px;color:#5a7465;margin:0}.promo .proof{position:absolute;left:52px;bottom:46px;font-size:13px;font-weight:650;letter-spacing:.3px;color:#496956}.workspace{position:absolute;left:560px;top:58px;width:810px;height:auto;border-radius:16px;border:1px solid #d6e0d5;box-shadow:0 18px 54px #24442c24}/* These real captures already include their bezels; do not clip or round them. */
.small{position:relative;width:440px;height:280px;background:#f5f5f5}
.small h1{position:absolute;top:27px;left:16px;right:16px;margin:0;text-align:center;font-size:24px;font-weight:750;line-height:1.15;letter-spacing:-.7px}
.small .phone,.small .tablet,.small .laptop{position:absolute;top:91px;height:136px;width:auto}
.small .phone{left:17px}
.small .tablet{left:102px}
.small .laptop{right:10px}
.og{width:1200px;height:630px;background:#f0f4ef;padding:40px}.og .brand{margin-bottom:20px}.og h1{margin:0 0 25px;font-size:40px;letter-spacing:-1.6px}.og img.capture{display:block;width:810px;height:auto;margin:0 auto;border:1px solid #d5e1d7;border-radius:12px;box-shadow:0 12px 34px #24442c20}
</style><main id="art"></main><script src="../listings/captions.js"></script><script>
const query=new URLSearchParams(location.search), asset=query.get('asset')||'screenshot-01', locale=query.get('locale')||'en';
const brand='<div class="brand"><img src="../../public/icons/icon-128.png" alt="">Mobile View</div>';
const captions=window.MDV_STORE_CAPTIONS;
const art=document.querySelector('#art');document.documentElement.lang=locale.replace('_','-');
if(asset.startsWith('screenshot-')){
 const index=Number(asset.slice(-2))-1; const shot=index===0?'overview':index===1?'sync-'+locale:'annotation-'+locale;
 art.className='screen';art.innerHTML='<header><h1></h1>'+brand+'</header><img class="capture" alt="Actual Mobile View extension workspace">';
 art.querySelector('h1').textContent=(captions[locale]||captions.en)[index];art.querySelector('.capture').src='captures/'+shot+'.png';
}else if(asset==='promo-small'){
 art.className='small';art.innerHTML='<h1>Test your site everywhere.</h1><img class="phone" src="captures/phone.png" alt="Actual phone preview of the Orbit demo website"><img class="tablet" src="captures/tablet.png" alt="Actual tablet preview of the same Orbit demo website"><img class="laptop" src="captures/desktop.png" alt="Actual laptop preview of the same Orbit demo website">';
}else if(asset==='promo-marquee'){
 art.className='promo';art.innerHTML=brand+'<h1>Find layout issues<br>before you ship.</h1><p>Compare responsive layouts<br>side by side.</p><div class="proof">FREE · LOCAL · OPEN SOURCE</div><img class="workspace" src="captures/overview.png" alt="Actual device comparison">';
}else{
 art.className='og';art.innerHTML=brand+'<h1>Find layout issues before you ship.</h1><img class="capture" src="captures/overview.png" alt="Actual Mobile View workspace">';
}
</script></html>
