<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#153b32;background:#f5f5f5}.brand{display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:-.4px;font-size:19px}.brand img{width:29px;height:29px;border-radius:7px}.screen{position:relative;width:1280px;height:800px;background:#f5f5f5}.screen header{height:80px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:15px 32px;background:#fff;border-bottom:1px solid #e3e9e5}.screen h1{margin:0;line-height:1.15;letter-spacing:-.65px;font-weight:750;font-size:28px;max-width:990px}.screen header .brand{font-size:14px;white-space:nowrap}.screen header .brand img{width:24px;height:24px}.screen>.capture{position:absolute;top:80px;left:0;width:1280px;height:720px}.lineup{display:flex;align-items:flex-end;justify-content:center;gap:12px}.lineup figure{margin:0;flex:none;text-align:center}.lineup img{display:block;height:var(--device-height);width:auto;max-width:none}.lineup .watch img{height:var(--watch-height)}.lineup figcaption{font-size:11px;font-weight:650;color:#607368;margin-top:16px;white-space:nowrap}.new{font-size:11px;line-height:1.3;letter-spacing:.8px;font-weight:750;color:#8b4055}.small{position:relative;width:440px;height:280px;background:#f5f5f5}.small h1{position:absolute;top:27px;left:16px;right:16px;margin:0;text-align:center;font-size:24px;font-weight:750;line-height:1.15;letter-spacing:-.7px}.small .new{position:absolute;top:66px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.5px}.small .lineup{position:absolute;left:0;right:0;top:103px;gap:10px;--device-height:112px;--watch-height:65px}.small figcaption{font-size:9px;margin-top:12px}.promo{width:1400px;height:560px;position:relative;background:#f5f5f5}.promo>.brand{position:absolute;left:50px;top:38px}.promo h1{position:absolute;left:50px;top:122px;width:450px;margin:0;font-size:56px;line-height:1.05;letter-spacing:-2.7px}.promo p{position:absolute;left:52px;top:330px;font-size:19px;line-height:1.5;max-width:365px;color:#5a7465;margin:0}.promo .new{position:absolute;left:52px;top:292px;font-size:13px}.promo .proof{position:absolute;left:52px;bottom:46px;font-size:12px;font-weight:650;letter-spacing:.5px;color:#496956}.promo .lineup{position:absolute;left:518px;right:24px;top:157px;gap:16px;--device-height:228px;--watch-height:130px}.promo figcaption{font-size:12px}.og{position:relative;width:1200px;height:630px;background:#f5f5f5;padding:40px}.og .brand{margin-bottom:24px}.og h1{margin:0;font-size:42px;letter-spacing:-1.6px}.og .new{margin-top:14px}.og .lineup{position:absolute;left:36px;right:36px;bottom:58px;--device-height:285px;--watch-height:160px;gap:26px}.og figcaption{font-size:13px}
</style><main id="art"></main><script src="../listings/captions.js"></script><script>
const query=new URLSearchParams(location.search), asset=query.get('asset')||'screenshot-01', locale=query.get('locale')||'en';
const brand='<div class="brand"><img src="../../public/icons/icon-128.png" alt="">Mobile View</div>';
const lineup='<div class="lineup">'+[['phone','iPhone 18 Pro'],['duo','iPhone Duo'],['desktop','Mac'],['watch','Apple Watch']].map(([file,label])=>'<figure class="'+file+'"><img src="captures/'+file+'.png" alt="Actual '+label+' preview of the Orbit demo website"><figcaption>'+label+'</figcaption></figure>').join('')+'</div>';
const captions=window.MDV_STORE_CAPTIONS;
const art=document.querySelector('#art');document.documentElement.lang=locale.replace('_','-');
if(asset.startsWith('screenshot-')){
 const index=Number(asset.slice(-2))-1; const shot=(index===0?'overview':index===1?'sync':'annotation')+'-'+locale;
 art.className='screen';art.innerHTML='<header><h1></h1>'+brand+'</header><img class="capture" alt="Actual four-device Mobile View extension workspace">';
 art.querySelector('h1').textContent=(captions[locale]||captions.en)[index];art.querySelector('.capture').src='captures/'+shot+'.png';
}else if(asset==='promo-small'){
 art.className='small';art.innerHTML='<h1>Test your site everywhere.</h1><div class="new">NEW · iPhone 18 Pro &amp; iPhone Duo</div>'+lineup;
}else if(asset==='promo-marquee'){
 art.className='promo';art.innerHTML=brand+'<h1>Find layout issues<br>before you ship.</h1><div class="new">NEW · iPhone 18 Pro &amp; iPhone Duo</div><p>Compare responsive layouts<br>across four device previews.</p><div class="proof">FREE · LOCAL · OPEN SOURCE</div>'+lineup;
}else{
 art.className='og';art.innerHTML=brand+'<h1>Find layout issues before you ship.</h1><div class="new">NEW · iPhone 18 Pro &amp; iPhone Duo</div>'+lineup;
}
</script></html>
